<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celina Aguirre — Fotografía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <div class="frame">

      <div class="botones">
        <a id="btn-instagram" class="boton boton--instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="4.4" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="17.35" cy="6.65" r="1.15" fill="currentColor"/>
          </svg>
          <span>Instagram</span>
        </a>

        <a id="btn-portfolio" class="boton boton--portfolio" href="#" target="_blank" rel="noopener" aria-label="Portfolio">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3 8.5C3 7.11929 4.11929 6 5.5 6H8L9.5 4H14.5L16 6H18.5C19.8807 6 21 7.11929 21 8.5V17C21 18.3807 19.8807 19.5 18.5 19.5H5.5C4.11929 19.5 3 18.3807 3 17V8.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="12" cy="12.5" r="3.5" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <span>Portfolio</span>
        </a>
      </div>

    </div>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
